name: NMLAbilities
version: '${version}'

main: io.github.NoOne.nMLAbilities.NMLAbilities
api-version: '26.3'
load: POSTWORLD
depend:
  - NMLDamages
  - NMLEnergy
  - NMLItems
  - NMLShields
  - NMLPlayerStats
  - NMLSkills
  - NMLWeapons
  - NMLAcrobatics
commands:
  expertise:
    description: Opens the menu to choose your expertise
    usage: /<command>
  setRotation:
    description: sets the player's yaw and pitch (for testing abilities)
    usage: /<command>